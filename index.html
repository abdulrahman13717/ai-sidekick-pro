<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Sidekick Pro — المساعد الذكي</title>
    <meta
      name="description"
      content="المساعد الذكي من AI Sidekick Pro — اسأل، لخّص، ترجم، واكتب. نفس المساعد الذي يعمل داخل متصفّحك."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* التوكنز منقولة حرفياً من src/ui/theme.css — الصفحة انعكاس للإضافة
         لا تصميم جديد، فأي انحراف لوني هنا يجعلها تبدو منتجاً آخر. */
      :root {
        --color-bg: #faf9f6;
        --color-surface: #faf9f6;
        --color-surface-2: #f2f1ed;
        --color-surface-3: #e9e8e2;
        --color-primary: #4a5d4e;
        --color-primary-dim: rgba(74, 93, 78, 0.1);
        --color-text: #1e1c1a;
        --color-text-muted: #6b6456;
        --color-border: rgba(30, 28, 26, 0.15);
        --color-on-primary: #ffffff;
        --radius-sm: 8px;
        --radius-lg: 16px;
        --radius-pill: 999px;
        --font-arabic: "Cairo", system-ui, sans-serif;
      }
      :root[data-theme="dark"] {
        --color-bg: #1e1c1a;
        --color-surface: #252220;
        --color-surface-2: #2e2b28;
        --color-surface-3: #383430;
        --color-primary: #d9785f;
        --color-primary-dim: rgba(217, 120, 95, 0.14);
        --color-text: #faf9f6;
        --color-text-muted: #a1a1aa;
        --color-border: rgba(250, 249, 246, 0.15);
        --color-on-primary: #1e1c1a;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        background: var(--color-bg);
        color: var(--color-text);
        font-family: var(--font-arabic);
        font-size: 16px;
        line-height: 1.75;
        display: flex;
        flex-direction: column;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 12px 16px;
        border-bottom: 1px solid var(--color-border);
        flex: 0 0 auto;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 700;
        font-size: 16px;
      }
      .dot {
        width: 26px;
        height: 26px;
        border-radius: var(--radius-sm);
        background: var(--color-primary);
        color: var(--color-on-primary);
        display: grid;
        place-items: center;
        font-size: 14px;
        font-weight: 700;
      }
      .tools {
        display: flex;
        gap: 6px;
      }
      .icon-btn {
        background: transparent;
        border: 1px solid var(--color-border);
        color: var(--color-text-muted);
        border-radius: var(--radius-pill);
        padding: 5px 13px;
        font: inherit;
        font-size: 13px;
        cursor: pointer;
      }
      .icon-btn:hover {
        color: var(--color-primary);
        border-color: var(--color-primary);
      }
      main {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 20px 16px 8px;
      }
      .thread {
        max-width: 720px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .empty {
        max-width: 720px;
        margin: 8vh auto 0;
        text-align: center;
      }
      .empty h1 {
        font-size: 25px;
        margin: 0 0 6px;
        font-weight: 700;
      }
      .empty p {
        color: var(--color-text-muted);
        margin: 0 0 22px;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        justify-content: center;
      }
      .chip {
        background: var(--color-surface-2);
        border: 1px solid var(--color-border);
        color: var(--color-text);
        border-radius: var(--radius-pill);
        padding: 8px 16px;
        font: inherit;
        font-size: 14px;
        cursor: pointer;
      }
      .chip:hover {
        border-color: var(--color-primary);
        color: var(--color-primary);
      }
      .msg.user {
        align-self: flex-start;
        max-width: 85%;
        background: var(--color-surface-2);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-lg);
        padding: 10px 14px;
        white-space: pre-wrap;
      }
      .msg.ai {
        align-self: stretch;
        white-space: pre-wrap;
      }
      .msg.ai::after {
        content: "▍";
        opacity: 0;
        color: var(--color-primary);
      }
      .msg.ai.typing::after {
        opacity: 1;
        animation: blink 1s steps(2) infinite;
      }
      @keyframes blink {
        50% {
          opacity: 0;
        }
      }
      .notice {
        border: 1px solid var(--color-border);
        background: var(--color-surface-2);
        border-radius: var(--radius-lg);
        padding: 12px 14px;
        color: var(--color-text-muted);
        font-size: 14.5px;
      }
      .notice b {
        color: var(--color-text);
      }
      .notice button {
        margin-top: 8px;
        background: var(--color-primary);
        color: var(--color-on-primary);
        border: none;
        border-radius: var(--radius-pill);
        padding: 7px 18px;
        font: inherit;
        font-size: 14px;
        cursor: pointer;
      }
      footer {
        flex: 0 0 auto;
        border-top: 1px solid var(--color-border);
        padding: 12px 16px 16px;
      }
      .composer {
        max-width: 720px;
        margin: 0 auto;
        display: flex;
        align-items: flex-end;
        gap: 8px;
        background: var(--color-surface-2);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-lg);
        padding: 8px 10px;
      }
      .composer:focus-within {
        border-color: var(--color-primary);
      }
      textarea {
        flex: 1 1 auto;
        border: none;
        background: transparent;
        color: var(--color-text);
        font: inherit;
        resize: none;
        max-height: 160px;
        outline: none;
        padding: 6px 4px;
      }
      .send {
        flex: 0 0 auto;
        background: var(--color-primary);
        color: var(--color-on-primary);
        border: none;
        border-radius: var(--radius-pill);
        width: 38px;
        height: 38px;
        font-size: 17px;
        cursor: pointer;
        display: grid;
        place-items: center;
      }
      .send:disabled {
        opacity: 0.45;
        cursor: default;
      }
      .foot-links {
        max-width: 720px;
        margin: 8px auto 0;
        text-align: center;
        font-size: 12.5px;
        color: var(--color-text-muted);
      }
      .foot-links a {
        color: var(--color-text-muted);
      }
    </style>
  </head>
  <body>
    <header>
      <div class="brand">
        <span class="dot">AI</span>
        <span>AI Sidekick <span style="color: var(--color-primary)">Pro</span></span>
      </div>
      <div class="tools">
        <button class="icon-btn" id="theme" type="button">الوضع الداكن</button>
        <button class="icon-btn" id="clear" type="button">محادثة جديدة</button>
      </div>
    </header>

    <main id="main">
      <div class="empty" id="empty">
        <h1>كيف أقدر أساعدك؟</h1>
        <p>اسأل، أو لخّص، أو ترجم — نفس المساعد الذي يعمل داخل متصفّحك.</p>
        <div class="chips">
          <button class="chip">اشرح لي الفرق بين HTTP وHTTPS</button>
          <button class="chip">اكتب لي رسالة اعتذار مهنية</button>
          <button class="chip">لخّص لي مفهوم الذكاء الاصطناعي التوليدي</button>
          <button class="chip">ترجم: نحن نبني أدوات تحترم وقتك</button>
        </div>
      </div>
      <div class="thread" id="thread"></div>
    </main>

    <footer>
      <div class="composer">
        <textarea
          id="input"
          rows="1"
          placeholder="اكتب رسالتك… (Enter للإرسال)"
        ></textarea>
        <button class="send" id="send" type="button" aria-label="إرسال">
          ↑
        </button>
      </div>
      <div class="foot-links">
        <a href="privacy.html">الخصوصية والشروط</a> ·
        <a href="privacy.html#about">عن الإضافة</a>
      </div>
    </footer>

    <script>
      const API = "https://proxy-eight-lake.vercel.app/api/chat";
      const SYSTEM =
        "أنت مساعد AI Sidekick Pro. أجب بإيجاز ووضوح، وبلغة السائل نفسها.";

      const $ = (id) => document.getElementById(id);
      const thread = $("thread");
      const input = $("input");
      const send = $("send");
      const empty = $("empty");
      const main = $("main");
      let messages = [];
      let busy = false;

      /* معرّف جهاز عشوائي — هو ما يعدّ به الخادم الحصّة، ولا يدلّ على أحد. */
      const deviceId = (() => {
        try {
          let v = localStorage.getItem("deviceId");
          if (!v) {
            v = crypto.randomUUID();
            localStorage.setItem("deviceId", v);
          }
          return v;
        } catch (e) {
          return crypto.randomUUID();
        }
      })();

      /* الثيم: اختيار المستخدم يسبق تفضيل النظام. */
      const applyTheme = (t) => {
        document.documentElement.dataset.theme = t;
        $("theme").textContent =
          t === "dark" ? "الوضع الفاتح" : "الوضع الداكن";
        try {
          localStorage.setItem("theme", t);
        } catch (e) {
          /* تخزين محجوب — الثيم لا يُحفظ، والصفحة تعمل */
        }
      };
      try {
        const saved = localStorage.getItem("theme");
        applyTheme(
          saved ||
            (matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light"),
        );
      } catch (e) {
        applyTheme("light");
      }
      $("theme").onclick = () =>
        applyTheme(
          document.documentElement.dataset.theme === "dark" ? "light" : "dark",
        );

      $("clear").onclick = () => {
        messages = [];
        thread.innerHTML = "";
        empty.style.display = "";
      };

      const scroll = () => (main.scrollTop = main.scrollHeight);

      const addMsg = (role, text) => {
        const el = document.createElement("div");
        el.className = "msg " + role;
        el.textContent = text;
        thread.appendChild(el);
        scroll();
        return el;
      };

      const addNotice = (html, onRetry) => {
        const el = document.createElement("div");
        el.className = "notice";
        el.innerHTML = html;
        if (onRetry) {
          const b = document.createElement("button");
          b.textContent = "أكمل";
          b.onclick = () => {
            el.remove();
            onRetry();
          };
          el.appendChild(b);
        }
        thread.appendChild(el);
        scroll();
      };

      document.querySelectorAll(".chip").forEach((c) => {
        c.onclick = () => {
          input.value = c.textContent.trim();
          ask();
        };
      });

      input.addEventListener("input", () => {
        input.style.height = "auto";
        input.style.height = Math.min(input.scrollHeight, 160) + "px";
      });
      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          ask();
        }
      });
      send.onclick = () => ask();

      async function ask(confirmQuota) {
        if (busy) return;
        const text = confirmQuota
          ? messages[messages.length - 1]?.parts?.[0]?.text
          : input.value.trim();
        if (!text) return;

        if (!confirmQuota) {
          empty.style.display = "none";
          addMsg("user", text);
          messages.push({ role: "user", parts: [{ text }] });
          input.value = "";
          input.style.height = "auto";
        }

        busy = true;
        send.disabled = true;
        const out = addMsg("ai", "");
        out.classList.add("typing");

        try {
          const res = await fetch(API, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "X-Device-Id": deviceId,
            },
            body: JSON.stringify({
              messages,
              systemInstruction: SYSTEM,
              quotaConfirm: confirmQuota === true,
            }),
          });

          if (!res.ok || !res.body) {
            out.remove();
            let code = "";
            try {
              code = (await res.json()).error || "";
            } catch (e) {
              /* الردّ ليس JSON — نكتفي برمز الحالة */
            }
            if (code === "quota_confirm")
              return addNotice(
                "هذا السؤال يستهلك جزءاً كبيراً من حصّتك اليومية.",
                () => ask(true),
              );
            if (res.status === 429)
              return addNotice(
                "<b>انتهت الحصّة اليومية.</b> جرّب غداً، أو ثبّت الإضافة واستعمل مفتاحك الخاص.",
              );
            if (code === "cors_blocked" || res.status === 403)
              return addNotice(
                "<b>المساعد غير متاح من هذه الصفحة بعد.</b> الخادم لم يُفتح لها — جرّب لاحقاً.",
              );
            return addNotice(
              "<b>تعذّر الوصول للمساعد.</b> تحقّق من اتصالك وأعد المحاولة.",
            );
          }

          /* البثّ: أسطر `data: {...}` بصيغة الخادم الموحّدة (sse_relay.js). */
          const reader = res.body.getReader();
          const dec = new TextDecoder();
          let buf = "";
          let acc = "";
          for (;;) {
            const { done, value } = await reader.read();
            if (done) break;
            buf += dec.decode(value, { stream: true });
            const lines = buf.split("\n");
            buf = lines.pop() || "";
            for (const line of lines) {
              const s = line.trim();
              if (!s.startsWith("data:")) continue;
              let ev;
              try {
                ev = JSON.parse(s.slice(5).trim());
              } catch (e) {
                continue;
              }
              if (ev.type === "chunk") {
                acc += ev.text || "";
                out.textContent = acc;
                scroll();
              } else if (ev.type === "error") {
                acc += "\n[انقطع الردّ]";
                out.textContent = acc;
              }
            }
          }
          out.classList.remove("typing");
          if (acc) messages.push({ role: "model", parts: [{ text: acc }] });
          else {
            out.remove();
            addNotice("<b>لم يصل ردّ.</b> أعد المحاولة.");
          }
        } catch (e) {
          out.remove();
          addNotice("<b>تعذّر الوصول للمساعد.</b> تحقّق من اتصالك.");
        } finally {
          busy = false;
          send.disabled = false;
          out.classList.remove("typing");
          input.focus();
        }
      }
    </script>
  </body>
</html>
